exp:
  experiment_name: smoke_png_gif
  seed: 7
  cuda: false
  n_rollout_threads: 1
  n_eval_rollout_threads: 1
  num_env_steps: 80

env:
  env_name: smoke_png_gif
  episode_length: 40
  max_hunters_num: 3
  num_explorers: 0
  target_policy_source: escape

reward:
  mi_diversity_enable: true
  mi_diversity_coef: 0.05
  mi_diversity_window: 4
  mi_diversity_temperature: 0.2
  traj_diversity_enable: true
  traj_diversity_coef: 0.05
  traj_diversity_window: 4

logging:
  save_interval: 1
  log_interval: 1
  log_gif: true
  log_png: true
  gif_frame_interval: 10

eval:
  use_eval: true
  val_interval: 1
  eval_episode_length: 60
  fixed_tasks:
    - num_hunters: 3
      hunters_in_zone: false
      world_size: 100.0
      seed: 12345
      target_policy_source: escape
  fixed_tasks_file: null
