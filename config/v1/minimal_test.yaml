exp:
  algorithm_name: rmappo
  experiment_name: Curriculum
  seed: 1
  num_env_steps: 5000 # total environment steps to train
  role_buffer_mode: role_shared  # Choices: ["separate", "role_shared"]
  
  n_rollout_threads: 5
  n_eval_rollout_threads: 10

  bad_stop_eval_times: 10
  bad_stop_max_episode: 600
  bad_stop_capture_rate_threshold: 0.4

# Environment settings (common)
env:
  env_name: MinimalTest
  world_size: 200
  episode_length: 100 # max steps per episode
  max_hunters_num: 3
  hunters_in_zone: true
  obs_mode: rel_polar  # Choices: ["legacy", "rel_polar"]
  action_frame: local
  hunter_collision_state_mode: collided  # Choices: ["dead", "collided"]


  neighbor_N: 3
  coord_summary_obs_enable: false
  coord_topk_hunters: 4

  target_policy_source: patrol # Choices: ["learn", "patrol", "random", "greedy", "escape"]
  target_switch_interval: 10

Hunter:
  perception_radius: -1
  control_mode: velocity  # Choices: ["acceleration", "velocity"]

Target: 
  perception_radius: -1
  control_mode: velocity

# UAV pursuit scenario settings
reward:
  # balance
  hunter_count_balance_enable: false
  hunter_count_balance_ref_hunters: 3
  
  # Collision Penalty
  target_collision_penalty: 5.0
  collision_penalty_k: 2.0
  collision_penalty_cap: 15.0
  safe_zone_penalty_scale: 1.0
  
  # Base chase reward
  base_reward_mode: delta_window  # Choices: ["legacy", "delta_window"]
  
  base_far_scale: 0.5
  base_near_scale: 2.0
  base_streak_scale: 0.2
  base_streak_cap: 30
  base_reward_inside_escape_scale: 0.4  # d<=escape_radius时base_reward缩放，避免与escape_gap冲突

  base_delta_window: 5
  base_delta_hunter_scale: 1.0
  base_delta_target_scale: 1.0
  base_delta_norm_scale: 20.0

  # inter-information MI
  mi_diversity_enable: false
  mi_diversity_coef: 2.0
  traj_diversity_enable: false
  traj_diversity_coef: 2.0

  spread_reward_enable: true
  spread_reward_coef: 2.0

  # Capture reward
  hunter_capture_reward: 150.0
  target_captured_penalty: 12.0
  capture_reward_allocation: alone  # Choices: ["team", "alone", "encircle"]

  # Speed Penalty
  speed_penalty: 0.2

  # Escape-gap encirclement reward
  escape_gap_enable: false
  escape_radius: 35.0

# Model/network settings
model:
  policy_share: true # whether all agents share the same policy
  hidden_size: 64
  layer_N: 1
  use_recurrent_policy: true


# Optimizer settings
optim:
  lr: 0.001
  critic_lr: 0.001
  opti_eps: 0.00001
  weight_decay: 0

# Learning rate schedule
schedule:
  use_linear_lr_decay: true

logging:
  log_gif: false         # 训练阶段是否按规则保存GIF
  log_png: false

eval:
  val_interval: 5
  eval_episode_length: 100
  fixed_tasks_file: config/eval_tasks/patrol_tasks_h8_p4_n100.yaml

domain_randomization:
  train_split:
    enable: false
    regen_interval_episode: 20
    regen_prob: 1.0
    hunter_count_choices: [1, 3, 5, 8]
    seed_range: [1, 99999]
    hunters_in_zone_choices: [false,true]
    target_policy_choices: ["patrol", "random", "escape"]
    patrol_name_choices: ["all"]

curriculum:
  enable: true
  stages:
    - name: warmup_small_map
      start_ratio: 0.0
      world_size_choices: [150.0]
      num_hunters_choices: [3]
      hunters_in_zone_choices: [false]
      hunter_max_speed_choices: [20.0]
      target_max_speed_ratio_choices: [0.6]
      capture_dis_ratio_choices: [1.5]
      target_policy_source_choices: ["patrol"]
      patrol_name_choices: ["all"]
      seed_range: [1, 99999]

    - name: medile
      start_ratio: 0.1
      world_size_choices: [120.0, 160.0, 200.0]
      num_hunters_choices: [1, 3, 5]
      hunters_in_zone_choices: [true]
      hunter_max_speed_choices: [20.0]
      target_max_speed_ratio_choices: [0.7, 0.8, 1.0, 1.2]
      capture_dis_ratio_choices: [1.2]
      target_policy_source_choices: ["patrol", "random", "escape"]
      patrol_name_choices: ["all"]
      seed_range: [1, 99999]

    - name: difficult
      start_ratio: 0.3
      world_size_choices: [150.0, 200.0, 300.0]
      num_hunters_choices: [1, 3, 5, 7, 10]
      hunters_in_zone_choices: [false, true]
      hunter_max_speed_choices: [20.0]
      target_max_speed_ratio_choices: [1.0, 1.2, 1.5]
      capture_dis_ratio_choices: [0.8, 1.0, 1.2]
      target_policy_source_choices: ["patrol", "random", "escape"]
      patrol_name_choices: ["all"]
      seed_range: [1, 99999]
# Pretrained model
pretrained:
  model_dir: null
