base_config: config/v1/polar.yaml
output_dir: results/sweeps/polar_own_obs
max_parallel: 4
python: python
train_script: train/train.py
time_stat: false
env_name: rel_spdN_dead_spd4_Ablation
progress_interval_sec: 300
progress_topk: 3

parameters:
  exp.num_env_steps:
    values: [2000000]
  env.action_frame:
    values: [local]
  env.obs_mode:
    values: [rel_polar]
  env.own_obs_items:
    values: [[speed_norm]]
  env.hunter_collision_state_mode:
    values: [dead]
  reward.base_reward_mode:
    values: [delta_window]
  
  reward.capture_reward_allocation:
    values: [spread]
  
  reward.mi_diversity_enable:
    values: [false]
  reward.mi_diversity_coef: 
    values: [1.0]

  reward.spread_reward_enable:
    values: [false, true]
  reward.spread_reward_coef:
    values: [4.0]
  
  optim.lr:
    values: [0.0002]
  schedule.use_linear_lr_decay:
    values: [true]
  domain_randomization.train_split.enable:
    values: [false]
  curriculum.enable: 
    values: [false, true]

conditional_ignore:
  - when:
      reward.base_reward_mode: legacy
    ignore:
      - reward.base_delta_*
  - when:
      reward.base_reward_mode: delta_window
    ignore:
      - reward.base_far_scale
      - reward.base_near_scale
  - when:
      reward.mi_diversity_enable: false
    ignore:
      - reward.mi_diversity_coef
  - when:
      reward.spread_reward_enable: false
    ignore:
      - reward.spread_reward_coef


plot:
  enabled: true
  buckets: [fixed_zone_false, fixed_zone_true]
  metrics: [capture_rate, alive_rate, eval_reward]
