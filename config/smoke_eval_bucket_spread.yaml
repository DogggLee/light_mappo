exp:
  algorithm_name: rmappo
  experiment_name: smoke_eval_bucket_spread
  seed: 7
  cuda: false
  n_rollout_threads: 1
  n_eval_rollout_threads: 1
  num_env_steps: 80

env:
  env_name: smoke_eval_bucket_spread
  episode_length: 40
  max_hunters_num: 3
  num_explorers: 0
  target_policy_source: escape

reward:
  spread_reward_enable: true
  spread_reward_coef: 0.5

logging:
  save_interval: 1
  log_interval: 1
  log_gif: false
  log_png: false

eval:
  use_eval: true
  val_interval: 1
  eval_episode_length: 60
  fixed_tasks:
    - num_hunters: 3
      hunters_in_zone: false
      world_size: 100.0
      seed: 12345
      target_policy_source: escape
  fixed_tasks_file: null
