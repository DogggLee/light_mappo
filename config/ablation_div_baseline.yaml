exp:
  algorithm_name: rmappo
  experiment_name: DeltaBase
  seed: 1
  num_env_steps: 4000000
  role_buffer_mode: role_shared
env:
  env_name: Tech
  world_size: 200
  episode_length: 400
  max_hunters_num: 3
  hunters_in_zone: true
  neighbor_N: 3
  coord_summary_obs_enable: false
  coord_topk_hunters: 4
  target_policy_source: patrol
  target_switch_interval: 10
Hunter:
  perception_radius: -1
  control_mode: velocity
Target:
  perception_radius: -1
  control_mode: velocity
reward:
  target_collision_penalty: 30.0
  collision_penalty_k: 10.0
  collision_penalty_cap: 50.0
  safe_zone_penalty_scale: 1.0
  base_reward_mode: delta_window
  base_far_scale: 0.2
  base_near_scale: 1.0
  base_streak_scale: 0.5
  base_streak_cap: 30
  base_reward_inside_escape_scale: 0.4
  base_delta_window: 5
  base_delta_hunter_scale: 1.0
  base_delta_target_scale: 1.0
  base_delta_norm_scale: 20.0
  escape_gap_enable: true
  escape_gap_hunter_reward_scale: 8.0
  escape_gap_target_reward_scale: 5.0
  escape_gap_encircle_hunter_reward_scale: 8.0
  escape_gap_encircle_target_reward_scale: 5.0
  escape_gap_intercept_hunter_reward_scale: 3.0
  escape_gap_intercept_target_reward_scale: 6.0
  escape_gap_quality_worst_penalty_threshold: 0.7
  escape_gap_quality_worst_penalty_scale: 5.0
  escape_radius: 35.0
  hunter_capture_reward: 15.0
  target_captured_penalty: 12.0
  capture_reward_allocation: encircle
  speed_penalty: 0.3
  mi_diversity_enable: false
  mi_diversity_coef: 0.0
  mi_diversity_window: 16
  mi_diversity_temperature: 0.2
  traj_diversity_enable: false
  traj_diversity_coef: 0.0
  traj_diversity_window: 16
model:
  policy_share: true
  hidden_size: 64
  layer_N: 1
  use_recurrent_policy: true
optim:
  lr: 0.001
  critic_lr: 0.001
  opti_eps: 1.0e-05
  weight_decay: 0
schedule:
  use_linear_lr_decay: true
logging:
  log_gif: false
  log_png: true
eval:
  eval_episode_length: 600
  fixed_tasks_file: config/eval_tasks/patrol_tasks_h10_p3_base50.yaml
domain_randomization:
  train_split:
    enable: true
    regen_interval_episode: 20
    regen_prob: 1.0
    hunter_count_choices:
    - 1
    - 2
    - 3
    seed_range:
    - 1
    - 99999
    hunters_in_zone_choices:
    - false
    - true
    target_policy_choices:
    - patrol
    - random
    - escape
    patrol_name_choices:
    - all
pretrained:
  model_dir: null
